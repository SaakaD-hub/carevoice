# Production override: run on one Linux VM, send logs to Splunk Cloud, serve over HTTPS.
# Usage on the server:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Differences from local:
#   - Logs go to SPLUNK_HEC_URL. Two options:
#       A) Splunk Cloud: set SPLUNK_HEC_URL to your Splunk Cloud HEC URL (default; Splunk container off)
#       B) Self-hosted Splunk on this VM (60-day trial): add  --profile selfhosted-splunk  and set
#          SPLUNK_HEC_URL=https://localhost:8088  SPLUNK_INSECURE_SKIP_VERIFY=true
#   - Postgres and backend are not exposed to the internet.
#   - Caddy serves the app on 80/443 with an automatic Let's Encrypt certificate.

x-splunk-logging-prod: &splunk-logging-prod
  driver: splunk
  options:
    splunk-url: ${SPLUNK_HEC_URL}
    splunk-token: ${SPLUNK_HEC_TOKEN}
    splunk-index: ${SPLUNK_INDEX:-main}
    splunk-source: carevoice
    splunk-format: json
    splunk-insecureskipverify: ${SPLUNK_INSECURE_SKIP_VERIFY:-false}
    splunk-verify-connection: "false"
    tag: "{{.Name}}"

services:
  postgres:
    ports: !reset []
    restart: unless-stopped

  backend:
    ports: !reset []
    environment:
      APP_ENV: prod
      APP_LOG_LEVEL: INFO
    restart: unless-stopped
    logging: *splunk-logging-prod

  frontend:
    ports: !reset []
    restart: unless-stopped
    logging: *splunk-logging-prod

  splunk:
    profiles: ["selfhosted-splunk"]   # off unless you choose option B
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:8000:8000"   # web UI only reachable via SSH tunnel:  ssh -L 8000:localhost:8000 user@server
      - "127.0.0.1:8088:8088"   # HEC only reachable from this machine (the Docker log driver)

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - frontend
    restart: unless-stopped
    logging: *splunk-logging-prod

volumes:
  caddy-data:
